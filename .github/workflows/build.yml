# Builds and checks both the thesis and the exposé (draft version) on every push and pull request.
name: Build and check PDF

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        document: [thesis, expose]
    uses: ./.github/workflows/build-document.yml
    with:
      document: ${{ matrix.document }}
      mode: draft
